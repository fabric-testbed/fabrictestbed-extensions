# Configuration for readthedocs.org.
# See https://docs.readthedocs.io/en/latest/config-file/v2.html

version: 2

# fablib needs Python 3.11 or greater, so pin the interpreter rather than
# taking the build image's default.
#
# `os` must name an image Read the Docs still offers. When one is retired the
# config fails *validation*: the build stops right after reading this file with
# no failing command and no error text in the log, which is a confusing way to
# find out. Valid as of 2026-08: ubuntu-22.04, ubuntu-24.04, ubuntu-lts-latest.
build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

# Tell RTD location of our Sphinx configuration.  Seems to work
# without this too, although default is docs/conf.py.
sphinx:
  configuration: docs/source/conf.py

# To be able to build API documentation, we need to install both docs
# requirements and package requirements, it seems.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
